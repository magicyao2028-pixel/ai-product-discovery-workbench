[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-product-discovery-workbench"
version = "0.4.0"
description = "Offline, evidence-traceable product discovery and governed interview-claim workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "magicyao2028-pixel" }]
dependencies = []

[project.scripts]
discovery-workbench = "product_discovery.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
